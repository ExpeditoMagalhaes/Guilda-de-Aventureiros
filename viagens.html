<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotas de Faerûn - D&D</title>
    <link rel="stylesheet" href="style-viagens.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Diário de Viagem</h1>
            <p class="subtitle">Trace a rota pelas estradas conhecidas</p>
        </header>

        <div id="route-builder">
            <div id="steps-container">
                <!-- Os campos de seleção (select) serão gerados aqui dinamicamente -->
            </div>
        </div>

        <div id="summary-box" class="summary-box hidden">
            <!-- O resumo atualizado aparecerá aqui -->
        </div>
    </div>

    <script src="script-viagens.js"></script>
</body>
</html>
