<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dito's Party</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #1a120c;
            color: #f4ecd8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .hub-container {
            background-color: #2c1e16;
            padding: 40px;
            border-radius: 8px;
            border: 2px solid #8b5a2b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 400px;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
            font-style: italic;
        }
        .tool-link {
            display: inline-block;
            background-color: #8b5a2b;
            color: #f4ecd8;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            transition: background-color 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .tool-link:hover {
            background-color: #6b4423;
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>Guilda de Aventureiros</h1>
        <p>Selecione a ferramenta desejada.</p>
        
        <!-- Link apontando para o seu arquivo renomeado -->
        <a href="viagens.html" class="tool-link">🗺️ Calculadora de Rotas</a>
    </div>
</body>
</html>
